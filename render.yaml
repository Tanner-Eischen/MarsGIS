services:
  - type: web
    name: marshab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: MARSHAB_WEB_WORKERS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MARSHAB_WEB_RELOAD
        value: "false"
      - key: MARSHAB_WEBUI_DIST
        value: /app/webui/dist
      - key: MARSHAB_PORTFOLIO_REFERENCE_DIR
        value: /app/webui/dist/portfolio
      - key: MARSHAB_REFERENCE_DEM_PATH
        value: /app/reference/jezero_ctx20m.tif
      - key: MARSHAB_PATHS__DATA_DIR
        value: /app/data
      - key: MARSHAB_PATHS__CACHE_DIR
        value: /app/data/cache
      - key: MARSHAB_PATHS__OUTPUT_DIR
        value: /app/data/output
      - key: MARSHAB_MOLA_COG_BOOTSTRAP_MODE
        value: skip
      - key: MARSHAB_MOLA_COG_REQUIRED
        value: "false"
      - key: MARSHAB_PREWARM_COG
        value: "false"
      - key: MARSHAB_TILE_ALLOW_DOWNLOAD
        value: "false"
      - key: MARSHAB_ALLOW_SYNTHETIC_TILES
        value: "false"
      - key: MARSHAB_ENABLE_EXPERIMENTAL_API
        value: "false"
      - key: MARSHAB_CORS_ALLOW_ALL
        value: "false"

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Scientific tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check marshab tests scripts
      - name: Full offline suite
        run: python -m pytest -q
      - name: Verify checked-in scientific reference bytes
        run: python scripts/build_portfolio_site.py --verify-only

  real-dem:
    name: Measured Jezero DEM demonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run strict real-data workflow (9.7 MB public source)
        run: python scripts/run_portfolio_demo.py
      - name: Check exported science and geometry independently
        run: |
          python scripts/run_portfolio_demo.py --output-dir data/output/repeat
          python scripts/verify_portfolio_demo.py --compare data/output/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: jezero-dem-analysis
          path: data/output/portfolio_demo/
          if-no-files-found: error

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run lint
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm audit --audit-level=moderate
        working-directory: webui
      - name: Ensure no hardcoded backend origin
        shell: bash
        run: |
          if grep -R -n -E "fetch\([[:space:]]*['\"]http://localhost:5000/api/v1" webui/src; then
            echo "Hardcoded localhost fetch() origin found in webui/src."
            exit 1
          fi
      - run: npm run build
        working-directory: webui

  unified-app:
    name: Unified container and real API workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete website and API image
        run: docker build -t marshab:ci .
      - name: Start the single-service deployment
        run: docker run -d --name marshab-ci --memory=512m -p 5000:5000 marshab:ci
      - name: Exercise real analysis and every exported artifact over HTTP
        run: python scripts/smoke_unified_app.py --timeout 300
      - name: Container logs and resource use
        if: always()
        run: |
          docker logs marshab-ci || true
          docker stats --no-stream marshab-ci || true
          docker exec marshab-ci cat /sys/fs/cgroup/memory.peak || true
      - name: Stop test container
        if: always()
        run: docker rm -f marshab-ci || true
